version: '3.8'

services:
  # MySQL 데이터베이스
  db:
    image: mysql:8.0
    container_name: xnd_mysql
    command:
      - --skip-character-set-client-handshake
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - xnd_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis (Celery 브로커)
  redis:
    image: redis:7-alpine
    container_name: xnd_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - xnd_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django 백엔드
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: xnd_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 Xnd.wsgi:application"
    volumes:
      - ./Backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xnd_network

  # Celery Worker
  celery_worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: xnd_celery_worker
    restart: always
    command: celery -A Xnd worker --loglevel=info
    volumes:
      - ./Backend:/app
    env_file:
      - ./Backend/.env
    depends_on:
      - backend
      - redis
      - db
    networks:
      - xnd_network

  # Celery Beat (스케줄러)
  celery_beat:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: xnd_celery_beat
    restart: always
    command: celery -A Xnd beat --loglevel=info
    volumes:
      - ./Backend:/app
    env_file:
      - ./Backend/.env
    depends_on:
      - backend
      - redis
      - db
    networks:
      - xnd_network

  # Nginx (리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: xnd_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - xnd_network

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  xnd_network:
    driver: bridge
